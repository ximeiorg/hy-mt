[package]
name = "hy-mt"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Rust inference for Tencent Hunyuan MT translation models (HY-MT1.5 / Hy-MT3, 1.8B & 7B, bf16 & FP8), on candle"
authors = ["kingzcheung"]
license = "MIT"
repository = "https://github.com/ximeiorg/hy-mt"
readme = "README.md"
keywords = ["machine-translation", "hunyuan", "candle", "rust", "nlp"]
categories = ["science", "text-processing"]

# Only ship what belongs in the crate (the repo also carries some local Python
# scratch files and editor metadata).
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "MERGE.md",
    "LICENSE",
]

[lib]
name = "hy_mt"
path = "src/lib.rs"

# candle 0.11 from crates.io: no git forks, no `[patch.crates-io]`, and every
# backend is a feature instead of a hard-coded CUDA dependency.
[dependencies]
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
# Pure-Rust regex backend: no oniguruma / C dependency.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
half = "2"
memmap2 = "0.9"

[dev-dependencies]
anyhow = "1"

[features]
default = ["cpu"]

# Backends. Additive: enable several and choose at runtime with
# `ModelOptions::with_device`, `TranslatorBuilder::device` or
# HYMT_DEVICE=cpu|metal[:N]|cuda[:N].
#
# Every backend feature must be forwarded to *both* candle crates: candle-core
# owns storage/matmul, candle-nn owns the fused RMSNorm/RoPE/softmax kernels.
cpu = []
metal = ["candle-core/metal", "candle-nn/metal"]
metal-debug-labels = [
    "metal",
    "candle-core/metal-debug-labels",
    "candle-nn/metal-debug-labels",
]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]

[[example]]
name = "text_generation_example"
path = "examples/text_generation_example.rs"

[[example]]
name = "translate"
path = "examples/translate.rs"

[[example]]
name = "stream_generation_example"
path = "examples/stream_generation_example.rs"

[[example]]
name = "sample"
path = "examples/sample.rs"

[[example]]
name = "cuda"
path = "examples/cuda.rs"

[[example]]
name = "quality"
path = "examples/quality.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "inspect_tokens"
path = "examples/inspect_tokens.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
