[package]
name = "hy-mt"
version = "0.1.0"
edition = "2024"
description = "A lightweight machine translation inference library for Tencent Hunyuan MT models"
authors = ["kingzcheung"]
license = "MIT"
repository = "https://github.com/ximeiorg/hy-mt"
readme = "README.md"
keywords = ["machine-translation", "hunyuan", "candle", "rust", "nlp"]
categories = ["science", "text-processing"]

[lib]
name = "hy_mt"
path = "src/lib.rs"

[dependencies]
candle-core = { version = "0.9.2-alpha.2", features = ["cuda"] }
candle-nn = { version = "0.9.2-alpha.2", features = ["cuda"] }
rand = "0.9.2"
serde = "1.0.228"
serde_json = "1.0.149"
tokenizers = "0.22.2"
tracing = "0.1.44"

[[example]]
name = "text_generation_example"
path = "examples/text_generation_example.rs"